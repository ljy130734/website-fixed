<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CuratorPath · 故宫博物院路线规划 | The Palace Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Telma'; src:url('fonts/Telma-Medium.otf') format('opentype'); font-weight:500; font-style:normal; font-display:swap; }

  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#ffffff; --ink:#111111; --ink-60:rgba(17,17,17,.6); --ink-40:rgba(17,17,17,.4);
    --line:1px solid #111111; --line-soft:1px solid rgba(17,17,17,.14); --panel:#fafafa;
    --red:#C41E3A; --red-soft:rgba(196,30,58,.12);
    --font-ui:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --font-mono:'Space Mono',monospace;
    --font-brand:'Telma','Space Grotesk',serif;
    /* 底图调色板（沿用 gugong-map.html 几何，替换为极简黑白） */
    --fill-1:#fafafa; --fill-2:#f3f3f3; --fill-3:#ececec; --fill-4:#e2e2e2;
    --fg:#111111; --fg-soft:#555555; --fg-muted:#999999;
    --line-dark:rgba(17,17,17,.25); --mapline:rgba(17,17,17,.10);
  }
  html,body { height:100%; }
  body { font-family:var(--font-ui); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; overflow:hidden; }
  button { font-family:inherit; cursor:pointer; }
  ::selection { background:var(--red); color:#fff; }

  .btn-solid { background:var(--ink); color:var(--bg); border:var(--line); padding:.85rem 2rem;
    font-family:var(--font-mono); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; transition:opacity .15s; }
  .btn-solid:hover { opacity:.82; }
  .btn-ghost { background:var(--bg); color:var(--ink); border:var(--line); padding:.85rem 2rem;
    font-family:var(--font-mono); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; transition:.15s; }
  .btn-ghost:hover { background:var(--ink); color:var(--bg); }

  /* ── 语言切换（右上角固定）── */
  #langSwitch { position:fixed; top:1.1rem; right:1.4rem; z-index:600; display:flex; border:var(--line); background:var(--bg); }
  #langSwitch button { border:none; background:var(--bg); color:var(--ink-40); padding:.45rem .8rem;
    font-family:var(--font-mono); font-size:.68rem; letter-spacing:.1em; transition:.13s; }
  #langSwitch button.on { background:var(--ink); color:var(--bg); }
  #langSwitch button:not(.on):hover { color:var(--ink); background:var(--panel); }
  #langSwitch .sep { width:1px; background:rgba(17,17,17,.2); }

  /* ═══ PHASE 0 · 品牌闪现 ═══ */
  #flash { position:fixed; inset:0; z-index:400; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem;
    opacity:0; transition:opacity .25s ease; }
  #flash.show { opacity:1; }
  #flash.hide { opacity:0; pointer-events:none; }
  #flash .fb { font-family:var(--font-brand); font-size:clamp(3rem,9vw,6.5rem); letter-spacing:.03em; }
  #flash .fs { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.34em; color:var(--ink-60); text-transform:uppercase; }

  /* ═══ PHASE 1 · 问卷 ═══ */
  #quiz { position:fixed; inset:0; z-index:300; background:var(--bg); overflow-y:auto; display:none; }
  #quiz.on { display:block; animation:fadeUp .45s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .quiz-inner { max-width:760px; margin:0 auto; padding:3.2rem 2rem 7rem; }
  .quiz-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:2.8rem; padding-right:6.5rem; }
  .quiz-brand { font-family:var(--font-brand); font-size:1.3rem; letter-spacing:.05em; }
  .quiz-museum { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.16em; color:var(--ink-60); text-transform:uppercase; }
  .quiz-title { font-size:clamp(1.9rem,4.5vw,2.7rem); font-weight:700; letter-spacing:-.02em; line-height:1.18; }
  .quiz-sub { margin-top:.7rem; color:var(--ink-60); font-size:.95rem; font-weight:300; }
  .q-block { margin-top:2.4rem; }
  .q-head { display:flex; align-items:baseline; gap:.8rem; margin-bottom:1rem; }
  .q-num { font-family:var(--font-mono); font-size:.72rem; color:var(--red); letter-spacing:.1em; }
  .q-label { font-size:1.05rem; font-weight:500; }
  .q-hint { font-family:var(--font-mono); font-size:.64rem; color:var(--ink-40); letter-spacing:.08em; margin-left:auto; text-transform:uppercase; }
  .opt-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.6rem; }
  .opt { border:var(--line); background:var(--bg); padding:.9rem .9rem .8rem; text-align:left; transition:.13s; display:flex; flex-direction:column; gap:.25rem; }
  .opt:hover { background:var(--panel); }
  .opt.on { background:var(--ink); color:var(--bg); }
  .opt .ol { font-size:.92rem; font-weight:500; }
  .opt .od { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.05em; opacity:.55; }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip { border:var(--line); background:var(--bg); padding:.5rem 1rem; font-size:.84rem; font-weight:300; transition:.13s; }
  .chip:hover { background:var(--panel); }
  .chip.on { background:var(--ink); color:var(--bg); }
  .quiz-actions { margin-top:3rem; display:flex; gap:.8rem; align-items:center; }
  #btnSkip { position:fixed; right:2rem; bottom:2rem; z-index:310; background:var(--bg); color:var(--ink-60);
    border:var(--line); padding:.8rem 1.5rem; font-family:var(--font-mono); font-size:.7rem;
    letter-spacing:.12em; text-transform:uppercase; transition:.15s; box-shadow:4px 4px 0 rgba(17,17,17,.12); }
  #btnSkip:hover { color:var(--bg); background:var(--ink); }

  /* ═══ PHASE 1.5 · AI 加载 ═══ */
  #loading { position:fixed; inset:0; z-index:350; background:var(--bg);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:1.6rem; }
  #loading.on { display:flex; animation:fadeUp .3s ease; }
  #loading .lt { font-size:1.6rem; font-weight:700; letter-spacing:-.01em; }
  #loading .lbar { width:220px; height:1px; background:rgba(17,17,17,.15); position:relative; overflow:hidden; }
  #loading .lbar i { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--red); transition:width .4s ease; }
  #loading .lstep { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.16em; color:var(--ink-60); text-transform:uppercase; min-height:1em; }

  /* ═══ PHASE 2 · 地图页 ═══ */
  #mapPage { display:none; height:100vh; grid-template-columns:330px 1fr; }
  #mapPage.on { display:grid; animation:fadeUp .45s ease; }
  @media(max-width:900px){ #mapPage.on { grid-template-columns:1fr; grid-template-rows:auto 1fr; } }

  #sidebar { border-right:var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); }
  @media(max-width:900px){ #sidebar{ border-right:none; border-bottom:var(--line); } }
  .sb-head { padding:1.3rem 1.4rem 1.1rem; border-bottom:var(--line-soft); padding-right:1.4rem; }
  .sb-brand-row { display:flex; align-items:baseline; justify-content:space-between; }
  .sb-brand { font-family:var(--font-brand); font-size:1.15rem; letter-spacing:.05em; }
  .sb-home { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; color:var(--ink-60); text-decoration:none; text-transform:uppercase; }
  .sb-home:hover { color:var(--ink); text-decoration:underline; }
  .sb-museum { margin-top:.5rem; font-size:1.02rem; font-weight:700; letter-spacing:-.01em; }
  .sb-museum-sub { font-family:var(--font-mono); font-size:.6rem; letter-spacing:.12em; color:var(--ink-40); margin-top:.2rem; text-transform:uppercase; }
  .sb-tabs { display:flex; border-bottom:var(--line-soft); }
  .sb-tab { flex:1; background:none; border:none; padding:.75rem 0 .65rem;
    font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-40); border-bottom:2px solid transparent; margin-bottom:-1px; transition:.15s; }
  .sb-tab.on { color:var(--ink); border-bottom-color:var(--red); }
  .sb-body { flex:1; overflow-y:auto; padding:1.1rem 1.2rem; min-height:0; }
  @media(max-width:900px){ .sb-body{ max-height:34vh; } }
  .sb-pane { display:none; } .sb-pane.on { display:block; }

  .route-item { border:var(--line-soft); padding:.85rem .95rem; margin-bottom:.55rem; cursor:pointer; background:var(--bg); transition:.13s; }
  .route-item:hover { border-color:var(--ink); }
  .route-item.on { border:var(--line); box-shadow:inset 3px 0 0 var(--red); }
  .route-item .rn { font-size:.92rem; font-weight:500; display:flex; align-items:center; gap:.5rem; }
  .route-item .rm { font-family:var(--font-mono); font-size:.62rem; color:var(--ink-60); margin-top:.35rem; letter-spacing:.04em; }
  .route-item .rd { font-size:.76rem; color:var(--ink-60); font-weight:300; margin-top:.3rem; line-height:1.5; }
  .route-item .ai-tag { font-family:var(--font-mono); font-size:.56rem; letter-spacing:.14em; border:1px solid var(--red); color:var(--red); padding:.12rem .4rem; text-transform:uppercase; }
  .route-item.custom { border:1px dashed var(--red); }

  .recustom-blurb { font-size:.86rem; color:var(--ink-60); font-weight:300; line-height:1.7; margin-bottom:1.2rem; }
  .pref-summary { border:var(--line-soft); padding:.9rem 1rem; margin-bottom:1.2rem; }
  .pref-summary .ps-row { display:flex; justify-content:space-between; gap:1rem; font-size:.78rem; padding:.28rem 0; }
  .pref-summary .ps-row span:first-child { color:var(--ink-60); font-weight:300; flex:0 0 auto; }
  .pref-summary .ps-row span:last-child { font-family:var(--font-mono); font-size:.68rem; text-align:right; }

  .sb-foot { border-top:var(--line-soft); padding:.9rem 1.2rem; }
  .sb-cur { font-family:var(--font-mono); font-size:.62rem; color:var(--ink-40); letter-spacing:.14em; text-transform:uppercase; margin-bottom:.4rem; }
  .sb-cur-route { font-size:.92rem; font-weight:500; }
  .sb-cur-meta { font-family:var(--font-mono); font-size:.64rem; color:var(--ink-60); margin-top:.25rem; }

  #main { display:flex; flex-direction:column; min-height:0; position:relative; background:var(--bg); }
  .route-head { padding:1.2rem 1.8rem 1rem; border-bottom:var(--line-soft); padding-right:7rem; }
  .route-head h1 { font-size:1.45rem; font-weight:700; letter-spacing:-.02em; }
  .route-meta { font-family:var(--font-mono); font-size:.68rem; color:var(--ink-60); margin-top:.45rem; letter-spacing:.05em; }
  .reason-chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
  .reason-chip { font-family:var(--font-mono); font-size:.6rem; letter-spacing:.06em; border:var(--line-soft); padding:.22rem .55rem; color:var(--ink-60); }
  .reason-chip b { color:var(--red); font-weight:700; }

  .region-bar { display:flex; align-items:stretch; border-bottom:var(--line); overflow-x:auto; background:var(--bg); }
  .region-btn { background:none; border:none; border-right:var(--line-soft); padding:.7rem 1.2rem .6rem;
    font-family:var(--font-ui); font-size:.86rem; font-weight:500; letter-spacing:.04em; color:var(--ink-40);
    transition:.13s; white-space:nowrap; }
  .region-btn small { display:block; font-family:var(--font-mono); font-size:.52rem; font-weight:400; letter-spacing:.1em; margin-top:.12rem; text-transform:uppercase; opacity:.75; }
  .region-btn:hover { color:var(--ink); background:var(--panel); }
  .region-btn.on { background:var(--red); color:#fff; }
  .region-btn.dim { opacity:.35; }
  .region-btn.dim.on { opacity:1; }
  .region-progress { margin-left:auto; align-self:center; padding:0 1.2rem; font-family:var(--font-mono);
    font-size:.62rem; color:var(--ink-40); letter-spacing:.12em; white-space:nowrap; text-transform:uppercase; }

  .region-view { flex:1; overflow-y:auto; padding:1.5rem 1.8rem 6.5rem; min-height:0; }
  .region-grid { display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:1.6rem; align-items:start; max-width:1240px; }
  @media(max-width:760px){ .region-grid{ grid-template-columns:1fr; } }
  .map-col { position:sticky; top:0; }
  @media(max-width:760px){ .map-col{ position:static; } }

  .region-title-row { display:flex; align-items:baseline; gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .region-title { font-size:1.3rem; font-weight:700; letter-spacing:-.01em; }
  .region-title .rt-en { font-family:var(--font-mono); font-size:.62rem; color:var(--ink-40); letter-spacing:.14em; text-transform:uppercase; margin-left:.6rem; }
  .region-sub { font-size:.8rem; color:var(--ink-60); font-weight:300; }

  /* ── 故宫底图 ── */
  .fmap-wrap { border:var(--line); background:#fff; }
  .fmap { width:100%; height:auto; display:block; }
  .fmap text { user-select:none; font-family:'Space Grotesk',sans-serif !important; }
  .fmap .area-block { cursor:pointer; transition:opacity .18s; }
  .fmap .area-block.rg-dim { opacity:.16; }
  .fmap .area-block .hl-rect { transition:.15s; }
  .fmap .area-block.on-route .hl-rect { stroke:var(--red); stroke-width:2; }
  .fmap .area-block:hover .hl-rect { fill:var(--red-soft); }
  .fmap .lbl { font-weight:500; text-anchor:middle; pointer-events:none; }
  .fmap .lbl-sub { font-weight:400; text-anchor:middle; pointer-events:none; }
  .fmap .road-lbl { font-family:'Space Mono',monospace !important; font-size:8px; fill:var(--fg-muted); text-anchor:middle; letter-spacing:.05em; }
  .fmap .compass { font-family:'Space Mono',monospace !important; font-size:9px; fill:var(--fg-muted); text-anchor:middle; letter-spacing:.1em; }
  .fmap .axis-line { stroke:var(--line-dark); stroke-width:1; stroke-dasharray:3,5; opacity:.6; }
  .fmap .rp-dim { stroke:var(--red); stroke-width:2; fill:none; opacity:.22; stroke-linejoin:round; }
  .fmap .rp-hot { stroke:var(--red); stroke-width:2.5; fill:none; stroke-dasharray:7 6; stroke-linejoin:round; animation:dashmove 1.2s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset:-26; } }
  .fmap .marker { fill:var(--red); stroke:#fff; stroke-width:1.5; }
  .fmap .marker-num { font-family:'Space Mono',monospace !important; font-size:11px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:central; }
  .map-legend { display:flex; gap:1.2rem; margin-top:.6rem; font-family:var(--font-mono); font-size:.6rem; color:var(--ink-60); letter-spacing:.08em; flex-wrap:wrap; }
  .map-legend i { display:inline-block; width:10px; height:10px; margin-right:.35rem; vertical-align:-1px; }
  .map-legend .lg-r { background:var(--red); }
  .map-legend .lg-g { background:#e2e2e2; border:1px solid rgba(17,17,17,.25); }
  .map-note { font-family:var(--font-mono); font-size:.6rem; color:var(--ink-40); letter-spacing:.1em; margin-top:.5rem; text-transform:uppercase; }

  /* ── 站点卡 ── */
  .stops { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:.7rem; }
  .stop-card { border:var(--line); background:var(--bg); padding:.9rem 1rem; cursor:pointer; transition:.13s; position:relative; }
  .stop-card:hover { background:var(--panel); box-shadow:4px 4px 0 rgba(196,30,58,.85); transform:translate(-2px,-2px); }
  .stop-ord { position:absolute; top:.8rem; right:.9rem; font-family:var(--font-mono); font-size:.78rem; font-weight:700; color:var(--red); }
  .stop-name { font-size:.98rem; font-weight:700; letter-spacing:-.01em; padding-right:2.2rem; }
  .stop-dur { font-family:var(--font-mono); font-size:.64rem; color:var(--ink-60); letter-spacing:.05em; margin-top:.3rem; }
  .stop-tags { display:flex; gap:.35rem; margin-top:.5rem; flex-wrap:wrap; }
  .stag { font-family:var(--font-mono); font-size:.54rem; letter-spacing:.1em; padding:.16rem .45rem; border:var(--line); text-transform:uppercase; }
  .stag.red { background:var(--red); border-color:var(--red); color:#fff; }
  .stag.soft { border-color:rgba(17,17,17,.25); color:var(--ink-60); }
  .stop-notes { margin-top:.5rem; font-size:.8rem; color:var(--ink-60); font-weight:300; line-height:1.55; }

  .region-empty { max-width:640px; border:1px dashed rgba(17,17,17,.35); padding:2rem; margin-top:1rem; }
  .region-empty h3 { font-size:1.05rem; font-weight:700; margin-bottom:.5rem; }
  .region-empty p { font-size:.86rem; color:var(--ink-60); font-weight:300; line-height:1.7; }
  .region-empty .fe-list { font-family:var(--font-mono); font-size:.7rem; color:var(--ink-60); margin-top:1rem; line-height:2; }

  #nextRegionBtn { position:absolute; right:1.6rem; bottom:1.6rem; z-index:20;
    background:var(--red); color:#fff; border:1px solid var(--red);
    font-family:var(--font-mono); font-size:.74rem; letter-spacing:.12em; text-transform:uppercase;
    padding:.95rem 1.6rem; box-shadow:5px 5px 0 rgba(196,30,58,.2); transition:.15s; }
  #nextRegionBtn:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 rgba(196,30,58,.2); }

  /* ── 总结卡 ── */
  .sum-card { border:var(--line); max-width:860px; }
  .sum-hero { padding:1.7rem 1.8rem 1.3rem; border-bottom:var(--line-soft); }
  .sum-hero .st { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.22em; color:var(--ink-40); text-transform:uppercase; }
  .sum-hero h2 { font-size:1.65rem; font-weight:700; letter-spacing:-.02em; margin-top:.5rem; }
  .sum-stats { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:var(--line-soft); }
  @media(max-width:640px){ .sum-stats{ grid-template-columns:repeat(2,1fr); } }
  .sum-stat { padding:1.1rem 1rem; border-right:var(--line-soft); text-align:center; }
  .sum-stat:last-child { border-right:none; }
  .sum-stat .n { font-size:1.9rem; font-weight:700; letter-spacing:-.02em; color:var(--red); }
  .sum-stat .l { font-family:var(--font-mono); font-size:.56rem; letter-spacing:.16em; color:var(--ink-40); margin-top:.3rem; text-transform:uppercase; }
  .sum-sec { padding:1.2rem 1.8rem; border-bottom:var(--line-soft); }
  .sum-sec h4 { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.2em; color:var(--ink-40); text-transform:uppercase; margin-bottom:.7rem; }
  .sum-sec p, .sum-sec li { font-size:.85rem; color:var(--ink-60); font-weight:300; line-height:1.8; }
  .sum-sec ul { list-style:none; }
  .sum-sec li b { color:var(--ink); font-weight:500; }
  .sum-actions { display:flex; gap:.7rem; padding:1.2rem 1.8rem; flex-wrap:wrap; }

  /* ── 展点信息卡 ── */
  #stopModal { position:fixed; inset:0; z-index:500; background:rgba(255,255,255,.88); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:1.5rem; }
  #stopModal.on { display:flex; animation:fadeUp .25s ease; }
  .sm-box { background:var(--bg); border:var(--line); max-width:540px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:8px 8px 0 rgba(17,17,17,.14); }
  /* 故宫无本地图片：统一灰底占位符 */
  .sm-media { position:relative; width:100%; aspect-ratio:16/8; border-bottom:var(--line); background:#eee; overflow:hidden; }
  .sm-media .sm-ph { position:absolute; inset:0; border-bottom:none; aspect-ratio:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.7rem; background:#eeeeee; }
  .sm-media .sm-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:2; }
  .sm-ph .ico { width:52px; height:52px; border:1px solid rgba(17,17,17,.3); display:flex; align-items:center; justify-content:center; }
  .sm-ph .ico svg { width:26px; height:26px; stroke:rgba(17,17,17,.55); fill:none; stroke-width:1.3; }
  .sm-ph .ch { font-family:var(--font-brand); font-size:2.6rem; color:rgba(17,17,17,.7); }
  .sm-ph .cp { font-family:var(--font-mono); font-size:.56rem; letter-spacing:.26em; color:var(--ink-40); text-transform:uppercase; }
  .sm-body { padding:1.3rem 1.5rem 1.5rem; }
  .sm-top { display:flex; align-items:flex-start; gap:1rem; }
  .sm-name { font-size:1.3rem; font-weight:700; letter-spacing:-.01em; }
  .sm-en { font-family:var(--font-mono); font-size:.6rem; color:var(--ink-40); letter-spacing:.08em; margin-top:.25rem; text-transform:uppercase; }
  .sm-close { margin-left:auto; background:none; border:var(--line); width:34px; height:34px; font-size:1rem; line-height:1; transition:.13s; flex:0 0 auto; }
  .sm-close:hover { background:var(--ink); color:var(--bg); }
  .sm-meta { display:flex; flex-wrap:wrap; gap:.4rem; margin:.85rem 0 .95rem; }
  .sm-meta .stag { font-size:.58rem; padding:.26rem .55rem; }

function fmtDur(min) {

  return LANG === 'en' ? h + ' h ' + m + ' min' : h + ' 小时 ' + m + ' 分';
}

/* ═══ AI 路线匹配 ═══ */
function matchRoute(prefs) {
  const reasons = [];
  const paidIds = ['G_Treasure', 'G_Clock', 'G_Ningshou'];

  /* 1. 时间 → 最接近的预置路线（平手时按节奏偏好） */
  let best = Infinity;
  ROUTES.forEach(r => { const d = Math.abs(r.duration_min - prefs.timeMin); if (d < best) best = d; });
  let pool = ROUTES.filter(r => Math.abs(r.duration_min - prefs.timeMin) === best);
  let base = pool[0];
  if (pool.length > 1 && prefs.pace === 'photo') base = pool.find(r => r.id === 'photo_spots') || pool[0];
  if (pool.length > 1 && prefs.pace === 'highlights') base = pool.find(r => r.id === 'highlights_2h') || pool[0];
  reasons.push(LANG === 'en'
    ? 'Based on <b>「' + TL(base, 'name') + '」</b> — closest to your time'
    : '以时长最接近的 <b>「' + base.name + '」</b> 为基底');

  let stops = base.stops.map(s => ({ ...s }));

  /* 2. 门票偏好：只看免费 → 剔除另购票馆 */
  if (prefs.ticket === 'free') {
    const removed = stops.filter(s => paidIds.includes(s.galleryId)).length;
    stops = stops.filter(s => !paidIds.includes(s.galleryId));
    if (removed) reasons.push(LANG === 'en'
      ? 'Free-only: <b>skipped paid halls</b> (Treasure / Clock / Ningshou)'
      : '只看免费：已 <b>跳过珍宝馆 / 钟表馆 / 宁寿宫区</b>');
  }

  /* 3. 兴趣 → 必含展厅 */
  const must = [];
  prefs.interests.forEach(iid => {
    const it = INTERESTS.find(x => x.id === iid);
    if (it) must.push(...it.galleries);
  });
  const inRoute = new Set(stops.map(s => s.galleryId));
  const addedNames = [], skippedPaid = [];
  [...new Set(must)].forEach(gid => {
    if (inRoute.has(gid)) return;
    const g = galleryById(gid);
    if (!g) return;
    if (prefs.ticket === 'free' && paidIds.includes(gid)) { skippedPaid.push(shortName(g.name)); return; }
    stops.push({ galleryId:gid, name:shortName(g.name), duration_min:g.walkingTime_min || 15,
      notes:g.description, added:true });
    addedNames.push(LANG === 'en' ? g.nameEN.split('(')[0].trim() : shortName(g.name));
  });
  if (addedNames.length) reasons.push(LANG === 'en'
    ? 'Interests added: <b>' + addedNames.join(', ') + '</b>'
    : '按兴趣必含 <b>' + addedNames.join('、') + '</b>');
  if (skippedPaid.length) reasons.push(LANG === 'en'
    ? 'Ticket pref overrode interest: <b>' + skippedPaid.join(', ') + ' skipped</b>'
    : '门票偏好优先：<b>' + skippedPaid.join('、') + '</b> 未加入');

  /* 4. 节奏调整 */
  if (prefs.pace === 'highlights') {
    stops = stops.filter(s => {
      const g = galleryById(s.galleryId), p = popOf(s.galleryId);
      return s.duration_min === 0 || (g && g.mustSee) || (p && p.tier <= 2) || must.includes(s.galleryId);
    });
    stops.forEach(s => { if (s.duration_min > 0) s.duration_min = round5(s.duration_min * 0.9); });
    reasons.push(LANG === 'en' ? 'Highlights pace: <b>tier-3 halls dropped</b>, time compressed' : '精选节奏：已 <b>跳过低人气展馆</b>、压缩停留');
  } else if (prefs.pace === 'deep') {
    stops.forEach(s => { if (s.duration_min > 0) s.duration_min = round5(s.duration_min * 1.3); });
    reasons.push(LANG === 'en' ? 'Deep pace: stay <b>+30%</b> at every hall' : '深度节奏：各展馆停留 <b>+30%</b>');
  } else if (prefs.pace === 'photo') {
    stops.forEach(s => { if (s.duration_min > 0) s.duration_min = round5(s.duration_min + 5); s.photo = true; });
    reasons.push(LANG === 'en' ? 'Photography: <b>+5 min photo time</b> at each stop' : '摄影节奏：每站 <b>+5 分钟</b>拍照时间');
  } else {
    stops.forEach(s => {
      if (s.duration_min > 0) s.duration_min = round5(s.duration_min * 1.1);
      const g = galleryById(s.galleryId);
      if (g && !g.mustSee) s.optional = true;
    });
    reasons.push(LANG === 'en' ? 'Wander pace: non-core halls marked <b>optional</b>' : '漫步节奏：非核心展馆标注为 <b>可自由取舍</b>');
  }

  /* 5. 门票「到现场再说」→ 标注可选 */
  if (prefs.ticket === 'later') {
    stops.forEach(s => { if (paidIds.includes(s.galleryId)) s.optionalTicket = true; });
    reasons.push(LANG === 'en' ? 'Paid halls marked <b>optional (+¥10 on site)</b>' : '另购票展馆已标注为 <b>可选（现场 +¥10）</b>');
  }

  /* 6. 出口虚拟站 + 按区域排序（南→北） */
  stops = stops.filter(s => !(s.duration_min === 0 && /神武门/.test(s.name || '')));
  stops = stops.map((s, i) => ({ ...s, _i:i }));
  stops.sort((a, b) => {
    const ra = REGION_ORDER.indexOf(regionOf(a.galleryId));
    const rb = REGION_ORDER.indexOf(regionOf(b.galleryId));
    return ra - rb || a._i - b._i;
  });
  stops.forEach((s, i) => { s.order = i + 1; delete s._i; });

  const walking = (base.totalWalkingTime_min || 20) + addedNames.length * 8;
  const totalMin = round5(stops.reduce((t, s) => t + s.duration_min, 0) + walking);

  return { id:'ai_custom', custom:true, name: LANG === 'en' ? 'AI Custom Route' : 'AI 定制路线',
    nameEN:'AI Custom Route', basedOn:base.name, description: LANG === 'en' ? 'Adjusted from "' + TL(base, 'name') + '"' : '基于「' + base.name + '」按你的偏好调整',
    stops, walkingMin:walking, totalMin, reasons };
}

function normalizePreset(r) {
  let stops = r.stops.map(s => ({ ...s }));
  stops = stops.filter(s => !(s.duration_min === 0 && /神武门/.test(s.name || '')));
  stops = stops.map((s, i) => ({ ...s, _i:i }));
  stops.sort((a, b) => {
    const ra = REGION_ORDER.indexOf(regionOf(a.galleryId));
    const rb = REGION_ORDER.indexOf(regionOf(b.galleryId));
    return ra - rb || a._i - b._i;
  });
  stops.forEach((s, i) => { s.order = i + 1; delete s._i; });
  const walking = r.totalWalkingTime_min || 20;
  const totalMin = round5(stops.reduce((t, s) => t + s.duration_min, 0) + walking);
  return { id:r.id, custom:false, name:r.name, nameEN:r.nameEN, description:r.description,
    stops, walkingMin:walking, totalMin, reasons:[] };
}

try {
  const saved = JSON.parse(localStorage.getItem('gg_prefs') || 'null');
  if (saved && saved.timeMin) state.prefs = saved;
} catch (e) {}

function exitStop() {
  return { galleryId:'EXIT', name:'神武门 · 出口', duration_min:0, virtual:true, order:99,
    notes:'参观结束，出神武门；可至景山公园俯瞰紫禁城全景' };
}
function routeRegions(route) {
  const set = new Set();
  route.stops.forEach(s => { const g = galleryById(s.galleryId); if (g) set.add(g.region); });
  set.add('South'); set.add('North');
  return REGION_ORDER.filter(r => set.has(r));
}
function stopsInRegion(route, rg) {
  const arr = route.stops.filter(s => {
    const g = galleryById(s.galleryId);
    return g && g.region === rg;
  });
  if (rg === 'South') arr.unshift({ galleryId:'G_MeridianGate', name:'午门 · 安检入场', duration_min:10, virtual:true, order:0, notes:'唯一入口，午门安检入场，大型特展在午门展厅' });
  if (rg === 'North') arr.push(exitStop());
  /* 入口虚拟站去重：若路线首站已是午门，则不再重复 */
  return arr.filter((s, i) => !(s.virtual && s.order === 0 && arr.some((x, j) => j !== i && x.galleryId === 'G_MeridianGate' && !x.virtual)));
}
function routeStats(route) {
  const gids = new Set(route.stops.map(s => s.galleryId));
  const treasures = ARTWORKS.filter(a => a.isNationalTreasure && gids.has(a.gallery)).length;
  return { stops:route.stops.length, regions:routeRegions(route).length, treasures, totalMin:route.totalMin };
}

/* ═══ 阶段切换 ═══ */
function showPhase(id) {
  ['flash', 'quiz', 'loading', 'mapPage'].forEach(p => $('#' + p).classList.remove('on'));
  if (id) $('#' + id).classList.add('on');
}
function runLoading(done) {
  showPhase('loading');
  const steps = T('loadingSteps');
  let i = 0;
  $('#lbarFill').style.width = '10%';
  const tick = () => {
    $('#lstep').textContent = steps[i];
    $('#lbarFill').style.width = Math.min(94, 10 + (i + 1) * 28) + '%';
    i++;
    if (i < steps.length) setTimeout(tick, 420);
    else setTimeout(() => { $('#lbarFill').style.width = '100%'; setTimeout(done, 260); }, 420);
  };
  setTimeout(tick, 150);
}

/* ═══ 地图页渲染 ═══ */
function setRoute(route, jumpToFirst) {
  state.route = route;
  state.regionsInRoute = routeRegions(route);
  if (route.custom) state.customRoute = route;
  renderRouteHead();
  renderLibrary();
  renderRegionBar();
  goRegion(jumpToFirst === false && state.region ? state.region : state.regionsInRoute[0]);
  renderPrefSummary();
}
function renderRouteHead() {
  const route = state.route, st = routeStats(route);
  $('#routeTitle').textContent = TL(route, 'name');
  $('#routeMeta').textContent = (LANG === 'en' ? '~' : '约 ') + fmtDur(st.totalMin) +
    (LANG === 'en' ? ' · ' + st.stops + ' stops · ' + st.regions + ' areas · ' + st.treasures + ' treasures'
                   : ' · ' + st.stops + ' 个站点 · 跨 ' + st.regions + ' 个区域 · 国宝 ' + st.treasures + ' 件');
  $('#reasonChips').innerHTML = (route.reasons || []).map(r => '<span class="reason-chip">' + r + '</span>').join('');
  $('#curRouteName').textContent = TL(route, 'name');
  $('#curRouteMeta').textContent = fmtDur(st.totalMin) + ' · ' + st.stops + (LANG === 'en' ? ' stops · ' : ' 站 · ') + st.regions + (LANG === 'en' ? ' areas' : ' 区');

/* ── 侧边栏：经典路线库 ── */
function renderLibrary() {
  const items = [];
  if (state.customRoute) items.push(routeItemHTML(state.customRoute, routeStats(state.customRoute), true));
  ROUTES.forEach(r0 => {
    const r = normalizePreset(r0);
    items.push(routeItemHTML(r, routeStats(r), false));

/* ── 区域栏 ── */
function renderRegionBar() {
  $('#regionBar').innerHTML = REGION_ORDER.map(rg => {
    const has = state.regionsInRoute.includes(rg);
    const meta = STR.regionNames[rg];
    return '<button class="region-btn' + (state.region === rg ? ' on' : '') + (has ? '' : ' dim') + '" data-r="' + rg + '">' +
      meta[LANG] + '<small>' + (LANG === 'en' ? meta.suben : meta.subcn) + '</small></button>';
  }).join('') + '<span class="region-progress" id="regionProg"></span>';
  document.querySelectorAll('.region-btn').forEach(b =>
    b.addEventListener('click', () => goRegion(b.dataset.r)));
}
$('#nextRegionBtn').addEventListener('click', () => {
  const idx = state.regionsInRoute.indexOf(state.region);
  if (idx >= 0 && idx < state.regionsInRoute.length - 1) goRegion(state.regionsInRoute[idx + 1]);
  else goRegion('SUMMARY');
});

/* ── 区域视图 ── */
function goRegion(rg) {
  state.region = rg;
  document.querySelectorAll('.region-btn').forEach(b => b.classList.toggle('on', b.dataset.r === rg));
  const idx = state.regionsInRoute.indexOf(rg);
  const prog = $('#regionProg');
  if (prog) prog.textContent = rg === 'SUMMARY' ? T('summary')
    : (idx + 1) + ' / ' + state.regionsInRoute.length + ' ' + T('regionProg');

  const view = $('#regionView');
  if (rg === 'SUMMARY') {
    view.innerHTML = summaryHTML();
    bindSummary(view);
  } else {
    const stops = stopsInRegion(state.route, rg);
    const meta = STR.regionNames[rg];
    let html = '<div class="region-grid"><div class="map-col">' + mapHTML() + '</div>' +
      '<div class="stops-col"><div class="region-title-row"><span class="region-title">' + meta[LANG] +
      '<span class="rt-en">' + meta.en.toUpperCase() + '</span></span>' +
      '<span class="region-sub">' + (LANG === 'en' ? meta.suben : meta.subcn) + '</span></div>';
    const realStops = stops.filter(s => !s.virtual);
    if (!realStops.length && rg !== 'South' && rg !== 'North') {
      const gs = GALLERIES.filter(g => g.region === rg);
      html += '<div class="region-empty"><h3>' + T('emptyTitle') + '</h3><p>' + T('emptyDesc') + '</p>' +
        '<div class="fe-list">' + gs.map(g => LANG === 'en' ? g.nameEN : shortName(g.name)).join(' · ') + '</div></div>';
    } else {
      html += '<div class="stops">' + stops.map(stopCardHTML).join('') + '</div>';
    }
    html += '</div></div>';
    view.innerHTML = html;
    bindRegionView(view, rg, stops);
  }
  view.scrollTop = 0;

  const btn = $('#nextRegionBtn');
  if (rg === 'SUMMARY') { btn.style.display = 'none'; return; }
  btn.style.display = '';
  if (idx >= 0 && idx < state.regionsInRoute.length - 1) {
    const nm = STR.regionNames[state.regionsInRoute[idx + 1]];
    btn.textContent = T('nextRegion') + '：' + nm[LANG] + ' ▸';
  } else {
    btn.textContent = T('finishRoute');
  }
}

/* ── 站点卡 ── */
function stopCardHTML(s) {
  const g = galleryById(s.galleryId);
  const isExit = s.galleryId === 'EXIT';
  const tags = [];
  if (s.virtual && !isExit) tags.push('<span class="stag red">' + T('startTag') + '</span>');
  if (isExit) tags.push('<span class="stag red">' + T('exitTag') + '</span>');
  if (g && g.mustSee) tags.push('<span class="stag red">' + T('mustSee') + '</span>');
  if (s.added) tags.push('<span class="stag red">' + T('addedForYou') + '</span>');
  if (s.optional) tags.push('<span class="stag soft">' + T('optional') + '</span>');
  if (s.optionalTicket) tags.push('<span class="stag soft">' + T('optTicket') + '</span>');
  else if (g && g.ticketExtra) tags.push('<span class="stag soft">' + T('paidTicket') + '</span>');
  const name = isExit ? T('exitTag') + ' · ' + (LANG === 'en' ? 'Shenwu Gate' : '神武门')
    : (g ? (LANG === 'en' ? g.nameEN : shortName(g.name)) : s.name);
  const dur = s.duration_min > 0
    ? '<div class="stop-dur">' + T('sugStay') + ' ' + s.duration_min + ' ' + T('minUnit') + '</div>' : '';
  return '<div class="stop-card" data-gid="' + s.galleryId + '">' +
    '<span class="stop-ord">' + (s.virtual ? (isExit ? '出' : '入') : String(s.order).padStart(2, '0')) + '</span>' +
    '<div class="stop-name">' + esc(name) + '</div>' + dur +
    (tags.length ? '<div class="stop-tags">' + tags.join('') + '</div>' : '') +
    (s.notes ? '<div class="stop-notes">' + esc(s.notes) + '</div>' : '') +
    '</div>';
}

  view.querySelector('#sumCopy').addEventListener('click', e => {

}

/* ── 地图图层：路线高亮 / 区域筛选 / 编号 ── */
function stopPoint(stop, shareInfo) {
  const gid = stop.galleryId === 'EXIT' ? 'EXIT' : MAP_BLOCK_OF(stop.galleryId);
  const p = GID_POS[gid] || { x:380, y:530 };
  const key = gid;
  const info = shareInfo[key];
  if (info.count > 1) {
    const idx = info.seen++;
    return { x: p.x + (idx - (info.count - 1) / 2) * 30, y: p.y };
  }
  return { x: p.x, y: p.y };
}
function buildShareInfo(stops) {
  const info = {};
  stops.forEach(s => {
    const k = s.galleryId === 'EXIT' ? 'EXIT' : MAP_BLOCK_OF(s.galleryId);
    info[k] = info[k] || { count:0, seen:0 };
    info[k].count++;
  });
  return info;
}
function updateMapLayers(view, rg, stops) {
  const svg = view.querySelector('.fmap');
  if (!svg) return;
  /* 区域筛选 + 路线高亮 */
  const routeGids = new Set(state.route.stops.map(s => MAP_BLOCK_OF(s.galleryId)));
  svg.querySelectorAll('.area-block').forEach(b => {
    const gid = b.dataset.gid;
    const blockRegion = gid === 'EXIT' ? 'North' : (gid ? regionOf(gid) : null);
    b.classList.toggle('rg-dim', blockRegion !== rg);
    b.classList.toggle('on-route', !!gid && (routeGids.has(gid) || routeGids.has(MAP_BLOCK_OF(gid))) && blockRegion === rg);
  });
  /* 全部站点点位（含出入口） */
  const allStops = state.route.stops.concat([exitStop()]);
  const shareAll = buildShareInfo(allStops);
  const allPts = allStops.map(s => stopPoint(s, shareAll));
  const rpLayer = svg.querySelector('#rpLayer');
  const mkLayer = svg.querySelector('#mkLayer');
  rpLayer.innerHTML = allPts.length > 1
    ? '<path class="rp-dim" d="M ' + allPts.map(p => p.x + ',' + p.y).join(' L ') + '"/>' : '';
  /* 当前区域高亮段 + 编号 marker */
  const shareRg = buildShareInfo(stops);
  const rgPts = stops.map(s => ({ s, p: stopPoint(s, shareRg) }));
  let hot = '', mks = '';
  if (rgPts.length > 1) hot = '<path class="rp-hot" d="M ' + rgPts.map(o => o.p.x + ',' + o.p.y).join(' L ') + '"/>';
  rgPts.forEach(o => {
    if (o.s.galleryId === 'EXIT' && rg !== 'North') return;
    const label = o.s.virtual ? (o.s.galleryId === 'EXIT' ? '出' : '入') : o.s.order;
    mks += '<g><circle class="marker" cx="' + o.p.x + '" cy="' + o.p.y + '" r="13"/>' +
      '<text class="marker-num" x="' + o.p.x + '" y="' + o.p.y + '">' + label + '</text></g>';
  });
  rpLayer.innerHTML += hot;
  mkLayer.innerHTML = mks;
}
function bindRegionView(view, rg, stops) {
  updateMapLayers(view, rg, stops);
  view.querySelectorAll('.stop-card').forEach(el => {
    el.addEventListener('click', () => {
      const gid = el.dataset.gid;
      const s = stops.find(x => x.galleryId === gid) || state.route.stops.find(x => x.galleryId === gid) || null;
      openStopModal(gid, s);
    });
  });
  view.querySelectorAll('.area-block[data-gid]').forEach(el => {
    el.addEventListener('click', () => {
      const gid = el.dataset.gid;
      const s = state.route.stops.find(x => MAP_BLOCK_OF(x.galleryId) === gid) || null;
      openStopModal(gid === 'EXIT' ? 'EXIT' : (s ? s.galleryId : gid), s);
    });
  });
}

/* ═══ 展点信息卡（灰底占位图）═══ */
let currentModal = null;
function openStopModal(gid, stop) {
  currentModal = { gid, stop };
  const isExit = gid === 'EXIT';
  const g = isExit ? null : galleryById(gid);
  const pop = g ? popOf(gid) : null;
  const treasures = g ? ARTWORKS.filter(a => a.gallery === gid || (gid === 'G_Ningshou' && a.gallery === 'G_Treasure') || (gid === 'G_Treasure' && a.gallery === 'G_Ningshou')) : [];
  const dur = stop && stop.duration_min > 0 ? stop.duration_min : (g ? Math.max(10, g.walkingTime_min || 15) : 0);
  const name = isExit ? (LANG === 'en' ? 'Shenwu Gate · Exit' : '神武门 · 出口')
    : (LANG === 'en' ? g.nameEN : shortName(g.name));
  const enSub = isExit ? 'Gate of Divine Prowess' : (LANG === 'en' ? shortName(g.name) : (g.nameEN || ''));
  const desc = isExit
    ? (LANG === 'en' ? 'North gate — the main exit. Jingshan Park across the street offers the best panoramic view of the Forbidden City.'
                     : '故宫北门，主要出口。出门即景山公园，登万春亭可俯瞰紫禁城全景。')
    : g.description;
  const regionTag = isExit ? STR.regionNames.North[LANG] : STR.regionNames[g.region][LANG];
  const tags = ['<span class="stag red">' + regionTag + '</span>'];
  if (dur) tags.push('<span class="stag soft">' + T('sugStay') + ' ' + dur + ' ' + T('minUnit') + '</span>');
  if (g && g.mustSee) tags.push('<span class="stag red">' + T('mustSee') + '</span>');
  if (g && g.type) tags.push('<span class="stag soft">' + esc(g.type) + '</span>');
  if (stop && stop.optionalTicket) tags.push('<span class="stag soft">' + T('optTicket') + '</span>');
  else if (g && g.ticketExtra) tags.push('<span class="stag red">' + T('paidTicket') + '</span>');
  else if (g) tags.push('<span class="stag soft">' + T('freeEntry') + '</span>');
  if (!stop && g) tags.push('<span class="stag soft">' + T('notInRoute') + '</span>');

  const phHTML = '<div class="sm-ph"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>' +
      '<span class="ch">' + (isExit ? '门' : shortName(g.name).charAt(0)) + '</span>' +
      '<span class="cp">' + (LANG === 'en' ? 'IMAGE PLACEHOLDER' : '图片占位') + '</span></div>';
  const photoHTML = (g && GALLERY_IMG[gid])
    ? '<img class="sm-photo" src="' + IMG_BASE + GALLERY_IMG[gid] + '" alt="' + esc(name) + '" loading="lazy" onerror="imgFail(this)">'
    : '';
  $('#smBox').innerHTML =
    '<div class="sm-media">' + phHTML + photoHTML + '</div>' +
    '<div class="sm-body"><div class="sm-top"><div>' +
      '<div class="sm-name">' + esc(name) + '</div>' +
      '<div class="sm-en">' + esc(enSub) + '</div></div>' +
      '<button class="sm-close" id="smClose">✕</button></div>' +
    '<div class="sm-meta">' + tags.join('') + '</div>' +
    '<div class="sm-desc">' + esc(desc) + (stop && stop.notes && !isExit ? '<br><br>' + esc(stop.notes) : '') + '</div>' +
    (treasures.length ? '<div class="sm-sec"><h5>' + T('highlights') + '</h5>' +
      treasures.map(a => '<div class="sm-treasure"><img class="tn" src="' + IMG_BASE + 'aw_' + a.id + '.jpg" alt="' + esc(TL(a, 'name')) + '" loading="lazy" onerror="imgFail(this,1)"><span>' + esc(TL(a, 'name')) + '</span><span class="tp">' + esc(a.period) + '</span></div>').join('') + '</div>' : '') +
    (pop ? '<div class="sm-sec"><h5>' + T('popularity') + ' ' + Math.round(pop.score * 100) + '</h5><div class="sm-pop"><i style="width:' + Math.round(pop.score * 100) + '%"></i></div></div>' : '') +
    '</div>';
  $('#stopModal').classList.add('on');
  $('#smClose').addEventListener('click', closeModal);
}
function closeModal() { $('#stopModal').classList.remove('on'); currentModal = null; }
function imgFail(el, kind) {
  if (kind === 1) { const s = document.createElement('span'); s.className = 'tn-ph'; el.replaceWith(s); }
  else { el.remove(); }
}
$('#stopModal').addEventListener('click', e => { if (e.target.id === 'stopModal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══ 问卷提交 / 跳过 ═══ */
$('#btnGenerate').addEventListener('click', () => {
  runLoading(() => {
    const route = matchRoute(state.prefs);
    setRoute(route, true);
    switchTab('A');
    showPhase('mapPage');
  });
});
$('#btnSkip').addEventListener('click', () => {
  const r0 = ROUTES.find(r => r.id === 'highlights_2h') || ROUTES[0];
  setRoute(normalizePreset(r0), true);
  switchTab('A');
  showPhase('mapPage');
});

/* ═══ 语言切换 ═══ */
function applyLang(lang) {
  LANG = lang === 'en' ? 'en' : 'cn';
  try { localStorage.setItem('cp_lang', LANG); } catch (e) {}
  document.documentElement.lang = LANG === 'cn' ? 'zh-CN' : 'en';
  document.querySelectorAll('#langSwitch button[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T(el.getAttribute('data-t')); });
  renderQuiz();
  if (state.route) {
    renderRouteHead(); renderLibrary(); renderRegionBar();
    goRegion(state.region || state.regionsInRoute[0]);
    renderPrefSummary();
  }
  if (currentModal) openStopModal(currentModal.gid, currentModal.stop);
}
$('#langSwitch').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (b && b.dataset.lang !== LANG) applyLang(b.dataset.lang);
});

/* ═══ 启动 ═══ */
(async function boot() {
  applyLang(LANG);
  const dataReady = loadData();
  const flash = $('#flash');
  flash.classList.add('show');
  await new Promise(r => setTimeout(r, 600));
  flash.classList.add('hide');
  await Promise.all([dataReady, new Promise(r => setTimeout(r, 280))]);
  flash.style.display = 'none';
  renderQuiz();
  showPhase('quiz');
})();
</script>
